<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickerUnits</title>
  <meta name="description" content="QuickerUnits — convertisseur d'unités pour ingénieurs civils et en structure. 100 % hors ligne.">
  <meta name="theme-color" content="#102d41">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d41'/%3E%3Ctext x='12' y='47' font-size='48' fill='%2356e0bb' font-family='sans-serif'%3EQ%3C/text%3E%3C/svg%3E">
  <style>
:root{--navy:#102d41;--ink:#17374b;--muted:#667f8e;--line:#dce5eb;--paper:#fff;--bg:#f0f4f7;--teal:#007f78;--mint:#d9f5eb;--mint2:#73e4c2;--amber:#b66c16;--shadow:0 2px 7px #15354a0d;--row:58px;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);min-height:100vh}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #20adba;outline-offset:2px}

/* ---------- top bar (QuickerBridge charter) ---------- */
.topbar{height:78px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-size:1.48rem;font-weight:650;letter-spacing:-.6px;white-space:nowrap}
.brand>div>span{font-weight:350;color:#9cdfcf}
.brand small{display:block;font-weight:500;letter-spacing:1.8px;font-size:.625rem;color:#92adbc;margin-top:4px}
.brand-mark{position:relative;color:var(--mint2);font-weight:800;font-size:2.5rem;line-height:1}
.brand-mark>span{position:absolute;font-size:1.2rem;right:-5px;bottom:-4px}
.header-right{display:flex;gap:22px;align-items:center}
.release-info{display:flex;flex-direction:column;gap:3px;font-size:.8rem;text-align:right;color:#ecf6f5}.release-info small{font-size:.72rem;color:#b5cbd6}
.language{display:flex;border:1px solid #4b6373;border-radius:6px;padding:3px}
.language button{padding:5px 9px;border:0;border-radius:4px;background:transparent;color:#c5d8e0;font-size:.875rem;font-weight:600}
.language button.selected{background:#fff;color:var(--navy)}

main{max-width:1780px;margin:0 auto;padding:22px 28px 8px}

/* ---------- reference table ("la bible") ---------- */
.bible{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.bible>summary{display:flex;align-items:center;gap:10px;padding:12px 18px;cursor:pointer;list-style:none;background:linear-gradient(180deg,#f6f9fb,#eef3f6);user-select:none}
.bible>summary::-webkit-details-marker{display:none}
.bible>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid #5d7d8c;border-bottom:2px solid #5d7d8c;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
.bible[open]>summary::before{transform:rotate(45deg)}
.bible[open]>summary{border-bottom:1px solid var(--line)}
.bible-title{font-family:Cambria,Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:1.02rem;color:var(--ink)}
.bible-hint{margin-left:auto;text-align:right;font-size:.74rem;color:var(--muted)}
.bible-grid{display:grid;grid-template-columns:1fr 1fr;padding:8px 10px 4px;column-gap:18px}
.bible-col+.bible-col{border-left:1px solid var(--line);padding-left:18px}
.eq{display:grid;grid-template-columns:minmax(0,1fr) 1.6em minmax(0,1.35fr);align-items:baseline;width:100%;border:0;background:transparent;padding:5px 10px;border-radius:7px;text-align:left;color:var(--ink);font-family:Cambria,Georgia,"Times New Roman",serif;font-size:1.02rem;transition:background .18s,color .18s;position:relative}
.eq .l{text-align:right;white-space:nowrap}.eq .m{text-align:center;color:#8ea3ae}.eq .r{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq:hover{background:#eef8f5;color:#00564f}
.eq::after{content:"→";position:absolute;right:10px;opacity:0;color:var(--teal);font-family:"Segoe UI",sans-serif;transition:opacity .18s,transform .18s;transform:translateX(-4px)}
.eq:hover::after{opacity:1;transform:none}
sup{font-size:.68em;line-height:0}

/* ---------- quick conversion bar ---------- */
.cmd-wrap{max-width:820px;margin:16px auto 0}
.cmd{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 14px;background:#fff;border:1px solid #cbd8e1;border-radius:12px;box-shadow:var(--shadow);cursor:text;transition:border-color .2s,box-shadow .2s}
.cmd:focus-within{border-color:#20adba;box-shadow:0 0 0 4px #20adba1f,0 6px 20px #0b3a4a12}
.cmd svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1.02rem;color:var(--ink);height:100%}
.cmd input::placeholder{color:#93a7b1}
.cmd kbd{flex:none}
.cmd-out{padding:0 6px;font-size:.92rem;color:var(--muted)}
.cmd-out:not(:empty){padding:10px 6px 0;animation:qbArrive .35s cubic-bezier(.2,.75,.25,1)}
.cmd-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cmd-eq{font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.cmd-eq b{font-size:1.35rem;font-weight:700;color:#00564f}
.cmd-act{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;transition:background .15s,border-color .15s}
.cmd-act:hover{background:#e6f6f3;border-color:#0a8f84;color:#006b62}
.cmd-hint{font-size:.74rem;color:#93a7b1;margin-left:auto}
.cmd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cmd-chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:.84rem;color:var(--ink);font-variant-numeric:tabular-nums;cursor:copy;transition:background .15s,border-color .15s}
.cmd-chip:hover{background:#eef8f5;border-color:#a9dccd}
.cmd-chip.si{border-left:3px solid #7fcdb9}.cmd-chip.imp{border-left:3px solid #ecc88a}
.cmd-chip small{color:var(--muted);margin-left:4px}
.cmd-err{color:#a33329}
.cmd-err em{font-style:normal;color:var(--muted)}
@media(max-width:560px){.cmd-hint{display:none}.cmd kbd{display:none}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px 18px;margin:18px 2px 12px;flex-wrap:wrap}
.tip{font-size:.8rem;color:var(--muted);line-height:1.5}
.tip b{color:var(--ink);font-weight:600}
kbd{font:600 .7rem "Segoe UI",sans-serif;border:1px solid #cbd8e1;border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;color:#486777}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools .label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.segmented{display:inline-flex;padding:3px;background:#e2eaf0;border-radius:7px;gap:2px}
.segmented button{border:0;background:transparent;padding:5px 10px;font-size:.8125rem;font-weight:600;color:var(--ink);border-radius:5px;white-space:nowrap;transition:background .15s}
.segmented button.active{background:#fff;box-shadow:0 1px 4px #20374718}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:5px 10px;font-size:.8125rem;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:#eef5f7}
.chip[aria-pressed=true]{border-color:#0a8f84;background:#e6f6f3;color:#006b62}

/* ---------- unit columns ---------- */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 10px 8px;min-width:0;transition:box-shadow .25s,border-color .25s}
.col:focus-within{border-color:#bfe3da;box-shadow:0 6px 22px #0b3a4a14}
.col-head{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding-bottom:11px;margin:0 2px 6px;border-bottom:1px solid var(--line)}
.ico{width:48px;height:48px;border-radius:13px;background:linear-gradient(145deg,#1b4a66,#102d41 70%);color:var(--mint2);display:grid;place-items:center;box-shadow:0 5px 14px #102d4133,inset 0 1px 0 #ffffff1f;transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
.col:focus-within .ico{transform:translateY(-2px) scale(1.04)}
.ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}
.col-title{font-weight:650;font-size:.95rem;line-height:1.2}
.col-dim{font-family:Cambria,Georgia,serif;font-size:.74rem;color:#8ea3ae;letter-spacing:.04em}
.col-clear{position:absolute;top:-6px;right:-2px;border:0;background:none;color:#9fb1bb;opacity:0;font-size:1rem;padding:2px 6px;border-radius:5px;transition:opacity .2s,color .2s}
.col:hover .col-clear,.col:focus-within .col-clear{opacity:1}.col-clear:hover{color:var(--teal);background:#eef5f7}
.group{position:relative}
.group+.group{margin-top:8px;padding-top:4px;border-top:1px dashed var(--line)}
.group-title{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5d7d8c;padding:6px 6px 2px}
.pill{position:absolute;left:0;right:0;top:0;height:var(--row);border-radius:9px;background:linear-gradient(90deg,#dff5ee,#effaf6 60%,#f7fcfa);border-left:3px solid var(--teal);opacity:0;pointer-events:none;z-index:0;transition:transform .5s cubic-bezier(.2,.85,.2,1),opacity .35s,height .3s}
.pill.on{opacity:1}
.row{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:7px;align-items:start;height:var(--row);padding:6px 6px 0 8px}
.cell{min-width:0}
.row input{width:100%;height:34px;border:1px solid #cbd8e1;border-radius:7px;padding:4px 9px;text-align:right;font-variant-numeric:tabular-nums;font-size:.95rem;background:#fff;color:var(--ink);transition:border-color .3s,box-shadow .3s,background .3s,color .3s}
.row input:hover{border-color:#a9c0cc}
.row input:focus{outline:none;border-color:#20adba;box-shadow:0 0 0 3px #20adba22}
.row.src input{border-color:var(--teal);background:#fbfffd;font-weight:650;color:#00564f;box-shadow:0 0 0 3px #0083781a}
.row.err input{border-color:#d0675a;background:#fff6f4;color:#a33329}
.row.flash input{animation:flash .6s ease}
@keyframes flash{0%{background:#c9f1e4}100%{background:#fbfffd}}
.fx{font-size:.66rem;color:#93a7b1;text-align:right;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:14px;font-variant-numeric:tabular-nums;transition:color .3s}
.row.src .fx{color:var(--teal);font-weight:600}
.unit{display:flex;flex-direction:column;justify-content:center;min-width:0;height:34px;border:0;background:transparent;text-align:left;padding:0 4px;border-radius:6px;cursor:copy;color:var(--ink);transition:background .15s}
.unit:hover{background:#eef5f7}
.unit b{font-size:.86rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.unit small{font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.nofx{--row:46px}.nofx .fx{display:none}
.sep{display:flex;align-items:center;gap:6px;height:22px;margin:4px 4px;position:relative;z-index:1}
.sep::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed #b9c9d2;z-index:-1}
.sep span{font-size:.66rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;line-height:1.3}
.sep .si{background:#e3f5ef;color:#006b62;border:1px solid #a9dccd}
.sep .imp{margin-left:auto;background:#fff3df;color:#8a4d0f;border:1px solid #ecd2a5}

/* ---------- extra units ---------- */
.more-wrap{display:flex;justify-content:center;margin:22px 0 4px}
.more{display:inline-flex;align-items:center;gap:9px;border:1px solid #0a8f84;background:linear-gradient(180deg,#14a597,#008378);color:#fff;font-size:.86rem;font-weight:600;padding:8px 18px;border-radius:999px;box-shadow:0 3px 12px #00837840;transition:transform .2s,box-shadow .2s,background .2s}
.more:hover{transform:translateY(-1px);box-shadow:0 6px 18px #00837855}
.more .plus{display:inline-block;transition:transform .35s cubic-bezier(.2,1.5,.4,1);font-size:1.1rem;line-height:1}
.more[aria-expanded=true]{background:#fff;color:#006b62}.more[aria-expanded=true] .plus{transform:rotate(45deg)}
.bonus-head{display:flex;align-items:center;gap:12px;margin:18px 2px 12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5d7d8c}
.bonus-head::after{content:"";flex:1;height:1px;background:var(--line)}
.hidden{display:none!important}

footer{max-width:1780px;margin:0 auto;padding:18px 28px 26px;font-size:.76rem;line-height:1.6;color:#617884;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;background:var(--navy);color:#e8f5f2;padding:9px 16px;border-radius:999px;font-size:.85rem;box-shadow:0 10px 30px #0b1e2b40;transition:opacity .25s,transform .3s cubic-bezier(.2,.85,.2,1);pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:#ffd49a;font-weight:650}

/* ---------- arrival (QuickerBridge qbArrive) ---------- */
@keyframes qbArrive{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.rv{animation:qbArrive .9s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s)}

@media(max-width:1500px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1100px){.topbar{padding:0 18px}main{padding:18px}.bible-hint{display:none}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bible-grid{grid-template-columns:1fr}.bible-col+.bible-col{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:4px}.release-info{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.topbar{height:68px;padding:0 16px}.brand{font-size:1.2rem}.brand small{display:none}.brand-mark{font-size:2rem}main{padding:14px 16px}.eq{font-size:.92rem}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.toolbar,.more-wrap,.col-clear,.toast{display:none!important}body{background:#fff}.col,.bible{box-shadow:none}}
  </style>
</head>
<body>
  <header class="topbar rv" style="--d:0s">
    <div class="brand"><span class="brand-mark">Q<span>↗</span></span><div>Quicker<span>Units</span><small data-i18n="brandSub"></small></div></div>
    <div class="header-right">
      <div class="release-info"><b id="release-version"></b><small id="release-date"></small></div>
      <div class="language" role="group" aria-label="Language / Langue"><button id="lang-en" type="button">EN</button><button id="lang-fr" type="button">FR</button></div>
    </div>
  </header>

  <main>
    <details class="bible rv" style="--d:.08s" id="bible" open>
      <summary><span class="bible-title" data-i18n="bibleTitle"></span><span class="bible-hint" data-i18n="bibleHint"></span></summary>
      <div id="bible-body"></div>
    </details>

    <div class="cmd-wrap rv" style="--d:.12s">
      <label class="cmd" for="cmd">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h11M12 7l5 5-5 5"/><path d="M19 5v14"/></svg>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="cmd-out" id="cmd-out" aria-live="polite"></div>
    </div>

    <div class="toolbar rv" style="--d:.16s">
      <div class="tip" data-i18n-html="tip"></div>
      <div class="tools">
        <button class="chip" id="fx-toggle" type="button" aria-pressed="true"><span>×</span><span data-i18n="factors"></span></button>
        <button class="chip" id="reset" type="button" data-i18n="reset"></button>
      </div>
    </div>

    <section class="grid" id="main-grid" aria-label="Units"></section>

    <div class="more-wrap rv" style="--d:.8s"><button class="more" id="more" type="button" aria-expanded="false" aria-controls="bonus"><span class="plus">+</span><span id="more-label"></span></button></div>

    <section id="bonus" class="hidden">
      <div class="bonus-head" data-i18n="bonusHead"></div>
      <div class="grid" id="bonus-grid"></div>
    </section>
  </main>

  <footer class="rv" style="--d:.9s">
    <div data-i18n-html="footL"></div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ===================== exact base constants ===================== */
const G = 9.80665;                 // standard gravity, m/s² (exact)
const IN = 0.0254, FT = 0.3048, MI = 1609.344;   // m (exact, 1959)
const LB = 0.45359237, OZ = LB / 16;                          // kg (exact)
const LBF = LB * G, KIP = 1000 * LBF;                         // N
const ARPENT2 = 3418.89;           // arpent carré (Québec) ≈ m²
const QU_META = { version: "0.4", date: "2026-10-06", author: "Anthony Chéruel" };

/* ===================== i18n ===================== */
const T = {
  fr: {
    brandSub: "CONVERTISSEUR D’UNITÉS · GÉNIE CIVIL",
    bibleTitle: "Unités courantes et équivalences",
    bibleHint: "Cliquez une équivalence pour la convertir",
    tip: "Tapez dans <b>n’importe quelle case</b> : tout se convertit en direct · <kbd>/</kbd> conversion rapide. Expressions acceptées (<kbd>2*600</kbd>, <kbd>1,5e3</kbd>) · <kbd>↑</kbd><kbd>↓</kbd> pour naviguer · <kbd>Échap</kbd> pour vider · clic sur une unité = copier.",
    factors: "Facteurs",
    reset: "Réinitialiser",
    more: n => `${n} unités supplémentaires`,
    less: "Masquer les unités supplémentaires",
    bonusHead: "Unités supplémentaires",
    si: "SI", imp: "Impérial · US",
    source: "◆ case source",
    copied: "Copié",
    cleared: "Colonne vidée",
    cmdPh: "Conversion rapide — ex. 25 ksi en MPa · 3/4 po · 100 °C en °F",
    cmdOpen: c => `Ouvrir dans ${c}`,
    cmdCopy: "Copier",
    cmdEnter: "Entrée : ouvrir la colonne",
    cmdUnknown: u => `Unité inconnue : « ${u} »`,
    cmdIncompat: (a, b) => `${a} et ${b} ne mesurent pas la même grandeur`,
    cmdNoNum: "Commencez par une valeur, ex. 25 ksi en MPa",
    cmdHelp: "symboles FR ou EN (po/in, pi/ft, kN·m, kip-ft, psi…) · « en », « to », « → », « = »",
    resetDone: "Valeurs par défaut rétablies",
    computed: "Calculé",
    clear: "Vider la colonne",
    footL: "<b>QuickerUnits</b> · facteurs exacts selon les définitions internationales (1959) et NIST SP 811.",
    sepSI: "SI", sepIMP: "Impérial"
  },
  en: {
    brandSub: "UNIT CONVERTER · CIVIL ENGINEERING",
    bibleTitle: "Common units and equivalences",
    bibleHint: "Click an equivalence to convert it",
    tip: "Type in <b>any box</b>: everything converts live · <kbd>/</kbd> quick convert. Expressions accepted (<kbd>2*600</kbd>, <kbd>1.5e3</kbd>) · <kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Esc</kbd> to clear · click a unit to copy.",
    factors: "Factors",
    reset: "Reset",
    more: n => `${n} more unit types`,
    less: "Hide extra units",
    bonusHead: "Extra units",
    si: "SI", imp: "Imperial · US",
    source: "◆ source box",
    copied: "Copied",
    cleared: "Column cleared",
    cmdPh: "Quick convert — e.g. 25 ksi to MPa · 3/4 in · 100 °C to °F",
    cmdOpen: c => `Open in ${c}`,
    cmdCopy: "Copy",
    cmdEnter: "Enter: open the column",
    cmdUnknown: u => `Unknown unit: “${u}”`,
    cmdIncompat: (a, b) => `${a} and ${b} do not measure the same quantity`,
    cmdNoNum: "Start with a value, e.g. 25 ksi to MPa",
    cmdHelp: "FR or EN symbols (in/po, ft/pi, kN·m, kip-ft, psi…) · “to”, “in”, “→”, “=”",
    resetDone: "Defaults restored",
    computed: "Computed",
    clear: "Clear column",
    footL: "<b>QuickerUnits</b> · exact factors from the 1959 international definitions and NIST SP 811.",
    sepSI: "SI", sepIMP: "Imperial"
  }
};

/* ===================== icons (uniform 32×32 line set) ===================== */
const ICONS = {

/* ===================== maths ===================== */
function toBase(unit, x) { return typeof unit.f === "number" ? x * unit.f : unit.f.to(x); }
function fromBase(unit, b) { return typeof unit.f === "number" ? b / unit.f : unit.f.from(b); }

const SUPMAP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-", "⁺": "+" };
const TOSUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };

/* group thousands + locale decimal separator */
function localize(str, lang) {
  let [i, d] = str.split(".");
  const neg = i.startsWith("-");
  if (neg) i = i.slice(1);
  const sep = lang === "fr" ? " " : ",";
  if (i.length > 3) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  return (neg ? "−" : "") + i + (d ? (lang === "fr" ? "," : ".") + d : "");
}
function trimZeros(s) { return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; }

/* engineering formatting:
   auto -> ≥1: 4 s.f. without rounding the integer part · <1: 3 s.f.
   n    -> n s.f. (integer part never rounded) */
function fmt(x, lang = S.lang, prec = S.prec) {
  if (x == null || !Number.isFinite(x)) return "";
  if (x === 0) return "0";
  const a = Math.abs(x);
  const nBig = prec === "auto" ? 4 : +prec, nSmall = prec === "auto" ? 3 : +prec;
  if (a >= 1e15 || a < 1e-6) return sci(x, Math.max(nSmall, 3), lang);
  let dec;
  if (a >= 1) dec = Math.max(0, nBig - (Math.floor(Math.log10(a)) + 1));
  else dec = nSmall - 1 - Math.floor(Math.log10(a));
  let s = x.toFixed(Math.min(dec, 20));
  if (Number(s) === 0) return sci(x, nSmall, lang);
  return localize(trimZeros(s), lang);
}
function sci(x, n, lang) {
  let [m, e] = x.toExponential(n - 1).split("e");
  m = trimZeros(m);
  const exp = String(+e).split("").map(c => TOSUP[c] || c).join("");
  return `${localize(m, lang)} × 10${exp}`;
}
/* factor for captions: 6 s.f. */
function fmtFactor(x, lang = S.lang) {
  if (!Number.isFinite(x)) return "";
  const a = Math.abs(x);
  if (a !== 0 && (a >= 1e9 || a < 1e-5)) return sci(x, 4, lang);
  const dec = a >= 1 ? Math.max(0, 6 - (Math.floor(Math.log10(a)) + 1)) : 5 - Math.floor(Math.log10(a));
  return localize(trimZeros(x.toFixed(dec)), lang);
}

/* safe arithmetic parser: + − × / ^ ( ) and scientific notation */
function parse(raw, lang = S.lang) {
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/[\s  ']/g, "");
  s = s.replace(/[×x*·]10([⁻⁺]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (_, e) => "e" + e.split("").map(c => SUPMAP[c]).join(""));
  s = s.replace(/[−–]/g, "-").replace(/[×x·]/gi, "*").replace(/÷/g, "/").replace(/\*\*/g, "^");
  s = lang === "fr" ? s.replace(/,/g, ".") : s.replace(/,/g, "");
  let i = 0;
  const peek = () => s[i];
  const num = () => {
    const m = /^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i.exec(s.slice(i));
    if (!m) throw 0;
    i += m[0].length;
    return parseFloat(m[0]);
  };
  const primary = () => {
    if (peek() === "(") { i++; const v = expr(); if (peek() !== ")") throw 0; i++; return v; }
    if (/^pi/i.test(s.slice(i))) { i += 2; return Math.PI; }
    if (peek() === "π") { i++; return Math.PI; }
    return num();
  };
  const unary = () => {
    if (peek() === "-") { i++; return -unary(); }
    if (peek() === "+") { i++; return unary(); }
    return power();
  };
  const power = () => { const b = primary(); if (peek() === "^") { i++; return Math.pow(b, unary()); } return b; };
  const term = () => {
    let v = unary();
    while (peek() === "*" || peek() === "/") { const op = s[i++]; const r = unary(); v = op === "*" ? v * r : v / r; }
    return v;
  };
  const expr = () => {
    let v = term();
    while (peek() === "+" || peek() === "-") { const op = s[i++]; const r = term(); v = op === "+" ? v + r : v - r; }
    return v;
  };
  try {
    const v = expr();
    if (i !== s.length || !Number.isFinite(v)) return NaN;
    return v;
  } catch { return NaN; }
}
const isExpression = raw => /[0-9.,)][\s]*[+\-*/×÷^(]|^\(|π|pi/i.test(String(raw).replace(/[eE][-+]/g, ""));

/* ===================== DOM helpers ===================== */
const $ = s => document.querySelector(s);
const t = k => T[S.lang][k];
const sym = unit => unit.s[S.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let toastTimer;
function toast(html) {
  const el = $("#toast");
  el.innerHTML = html;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1700);
}

/* ===================== rendering ===================== */
const ROWS = {};    // gid -> {unitId: {row, input, fx}}, plus .pill

function renderStatic() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  $("#cmd").placeholder = t("cmdPh");
  if ($("#cmd").value) renderCommand();
  $("#release-version").textContent = `v${QU_META.version} · ${QU_META.author}`;
  $("#release-date").textContent = `${S.lang === "fr" ? "Mise à jour : " : "Updated "}${QU_META.date}`;
  $("#lang-fr").classList.toggle("selected", S.lang === "fr");
  $("#lang-en").classList.toggle("selected", S.lang === "en");
  $("#fx-toggle").setAttribute("aria-pressed", String(S.fx));
  document.body.classList.toggle("nofx", !S.fx);
  updateMore();
  renderBible();
}

function txt(v) { return typeof v === "string" ? v : v[S.lang]; }
function dec(s) { return S.lang === "fr" ? s : s.replace(/(\d),(\d)/g, "$1.$2"); }
function renderBible() {
  const line = e => `<button type="button" class="eq" data-go="${e.go.join("|")}"><span class="l">${txt(e.l)}</span><span class="m">=</span><span class="r">${dec(txt(e.r))}</span></button>`;
  $("#bible-body").innerHTML =
    `<div class="bible-grid"><div class="bible-col">${BIBLE.left.map(line).join("")}</div><div class="bible-col">${BIBLE.right.map(line).join("")}</div></div>`;
  $("#bible").open = S.bible;
}

function colHTML(c, idx, baseDelay) {
  const d = baseDelay + idx * 0.08;
  let html = `<article class="col rv" style="--d:${d.toFixed(2)}s" data-cat="${c.id}">
    <div class="col-head">
      <div class="ico"><svg viewBox="0 0 32 32" aria-hidden="true">${ICONS[c.icon]}</svg></div>
      <div class="col-title">${esc(c.name[S.lang])}</div>
      <div class="col-dim">${c.dim}</div>
      <button class="col-clear" type="button" data-clear="${c.id}" title="${esc(t("clear"))}" aria-label="${esc(t("clear"))}">↺</button>
    </div>`;
  c.groups.forEach(g => {
    html += `<div class="group" data-gid="${g.gid}">`;
    if (g.title) html += `<div class="group-title">${esc(g.title[S.lang])}</div>`;
    html += `<div class="pill"></div>`;
    const row = (unit, k) => `<div class="row rv" style="--d:${(d + 0.12 + k * 0.03).toFixed(2)}s" data-u="${unit.id}">
        <div class="cell"><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${esc(unit.n[S.lang])} (${esc(sym(unit))})"><div class="fx"></div></div>
        <button class="unit" type="button" title="${esc(unit.n[S.lang])}"><b>${esc(sym(unit))}</b><small>${esc(unit.n[S.lang])}</small></button>
      </div>`;
    let k = 0;
    g.si.forEach(unit => { html += row(unit, k++); });
    html += `<div class="sep rv" style="--d:${(d + 0.12 + k * 0.03).toFixed(2)}s"><span class="si">▲ ${t("sepSI")}</span><span class="imp">${t("sepIMP")} ▼</span></div>`;
    g.imp.forEach(unit => { html += row(unit, k++); });
    html += `</div>`;
  });
  return html + `</article>`;
}

function renderGrids() {
  $("#main-grid").innerHTML = CATS.map((c, i) => colHTML(c, i, 0.2)).join("");
  $("#bonus-grid").innerHTML = BONUS.map((c, i) => colHTML(c, i, 0.05)).join("");
  document.querySelectorAll(".group").forEach(gEl => {
    const gid = gEl.dataset.gid;
    ROWS[gid] = { pill: gEl.querySelector(".pill"), rows: {} };
    gEl.querySelectorAll(".row").forEach(r => {
      ROWS[gid].rows[r.dataset.u] = { row: r, input: r.querySelector("input"), fx: r.querySelector(".fx") };
    });
  });
  Object.keys(GROUPS).forEach(gid => refresh(gid, null, true));
}

/* write every box of a group from the stored base value (except the one being typed in) */
function refresh(gid, skipUnit, initial) {
  const { g } = GROUPS[gid];
  const st = S.vals[gid];
  const R = ROWS[gid];
  const src = g.units.find(x => x.id === st.u);
  g.units.forEach(unit => {
    const r = R.rows[unit.id];
    const isSrc = unit.id === st.u;
    r.row.classList.toggle("src", isSrc && st.v != null);
    if (unit.id !== skipUnit) {
      r.input.value = st.v == null ? "" : fmt(fromBase(unit, st.v), S.lang, isSrc ? "6" : S.prec);
      r.row.classList.remove("err");
    }
    r.fx.textContent = isSrc ? (st.v == null ? "" : t("source")) : caption(src, unit);
  });
  movePill(gid, initial);
}

/* "1 mm = 0,03937 po" or an affine formula for temperatures */
function caption(src, unit) {
  if (typeof src.f === "number" && typeof unit.f === "number") return `1 ${sym(src)} = ${fmtFactor(src.f / unit.f)} ${sym(unit)}`;
  const b = fromBase(unit, toBase(src, 0)), a = fromBase(unit, toBase(src, 1)) - b;
  const A = Math.abs(a - 1) < 1e-12 ? "" : ` × ${fmtFactor(a)}`;
  const B = Math.abs(b) < 1e-12 ? "" : ` ${b < 0 ? "−" : "+"} ${fmtFactor(Math.abs(b))}`;
  return `${sym(unit)} = ${sym(src)}${A}${B}`;
}

function movePill(gid, instant) {
  const R = ROWS[gid], st = S.vals[gid];
  const r = R.rows[st.u];
  if (!r || st.v == null) { R.pill.classList.remove("on"); return; }
  if (instant) R.pill.style.transition = "none";
  R.pill.style.transform = `translateY(${r.row.offsetTop}px)`;
  R.pill.classList.add("on");
  if (instant) { void R.pill.offsetHeight; R.pill.style.transition = ""; }
}
function moveAllPills(instant) { Object.keys(ROWS).forEach(gid => movePill(gid, instant)); }

function updateMore() {
  const btn = $("#more");
  btn.setAttribute("aria-expanded", String(S.bonus));
  $("#more-label").textContent = S.bonus ? t("less") : t("more")(BONUS.length);
  $("#bonus").classList.toggle("hidden", !S.bonus);
}

/* ===================== interactions ===================== */
function locate(target) {
  const row = target.closest(".row"), gEl = target.closest(".group");
  return row && gEl ? { gid: gEl.dataset.gid, uid: row.dataset.u, row } : null;
}

document.addEventListener("input", e => {
  if (!e.target.matches(".row input")) return;
  const { gid, uid, row } = locate(e.target);
  const unit = GROUPS[gid].g.units.find(x => x.id === uid);
  const v = parse(e.target.value);
  const st = S.vals[gid];
  if (v === null) { st.u = uid; st.v = null; refresh(gid, uid); persist(); return; }
  if (Number.isNaN(v)) { row.classList.add("err"); return; }
  row.classList.remove("err");
  st.u = uid;
  st.v = toBase(unit, v);
  refresh(gid, uid);
  persist();
});

document.addEventListener("focusout", e => {
  if (!e.target.matches(".row input")) return;
  const { gid, uid, row } = locate(e.target);
  const st = S.vals[gid];
  if (row.classList.contains("err")) { row.classList.remove("err"); refresh(gid); return; }
  if (st.u === uid && st.v != null && isExpression(e.target.value)) {
    const unit = GROUPS[gid].g.units.find(x => x.id === uid);
    const shown = fmt(fromBase(unit, st.v), S.lang, "6");
    toast(`${t("computed")} : <b>${esc(e.target.value.trim())}</b> = ${shown} ${esc(sym(unit))}`);
    e.target.value = shown;
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
  }
});

document.addEventListener("focusin", e => { if (e.target.matches(".row input")) e.target.select(); });

document.addEventListener("keydown", e => {
  if (!e.target.matches(".row input")) return;
  const { gid, uid } = locate(e.target);
  const units = GROUPS[gid].g.units;
  const k = units.findIndex(x => x.id === uid);
  let next = null;
  if (e.key === "ArrowDown" || (e.key === "Enter" && !e.shiftKey)) next = units[(k + 1) % units.length];
  else if (e.key === "ArrowUp" || (e.key === "Enter" && e.shiftKey)) next = units[(k - 1 + units.length) % units.length];
  else if (e.key === "Escape") { S.vals[gid].v = null; refresh(gid); persist(); e.target.select(); return; }
  if (next) { e.preventDefault(); ROWS[gid].rows[next.id].input.focus(); }
});

document.addEventListener("click", e => {
  const unitBtn = e.target.closest(".unit");
  if (unitBtn) {
    const { gid, uid } = locate(unitBtn);
    const val = ROWS[gid].rows[uid].input.value;
    if (!val) return;
    const unit = GROUPS[gid].g.units.find(x => x.id === uid);
    const text = `${val} ${sym(unit)}`;
    const done = () => toast(`${t("copied")} : <b>${esc(text)}</b>`);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
    return;
  }
  const clr = e.target.closest("[data-clear]");
  if (clr) {
    const cat = ALL.find(c => c.id === clr.dataset.clear);
    cat.groups.forEach(g => { S.vals[g.gid].v = null; refresh(g.gid); });
    persist(); toast(t("cleared"));
    return;
  }
  const eq = e.target.closest("[data-go]");
  if (eq) { goTo(...eq.dataset.go.split("|")); return; }
});

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch { /* ignore */ }
  ta.remove();
}

/* bible line → load value in its column, reveal it, glow */
function goTo(catId, uid, value, gid, keepFocus) {
  const cat = ALL.find(c => c.id === catId);
  const g = gid ? GROUPS[gid].g : cat.groups[0];
  if (BONUS.includes(cat) && !S.bonus) toggleBonus(true);
  S.vals[g.gid] = { u: uid, v: toBase(g.units.find(x => x.id === uid), +value) };
  refresh(g.gid);
  persist();
  const r = ROWS[g.gid].rows[uid];
  r.row.closest(".col").scrollIntoView({ behavior: "smooth", block: "nearest" });
  r.row.classList.remove("flash"); void r.row.offsetWidth; r.row.classList.add("flash");
  if (!keepFocus) setTimeout(() => r.input.focus({ preventScroll: true }), 350);
}

function toggleBonus(force) {
  S.bonus = force ?? !S.bonus;
  updateMore();
  if (S.bonus) {
    $("#bonus").querySelectorAll(".rv").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
    requestAnimationFrame(() => {
      moveAllPills(true);
      if (force === undefined) $("#bonus").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  persist();
}

$("#more").addEventListener("click", () => toggleBonus());
$("#fx-toggle").addEventListener("click", () => {
  S.fx = !S.fx; renderStatic(); moveAllPills(false); persist();
});
$("#reset").addEventListener("click", () => {
  defaults(); Object.keys(GROUPS).forEach(gid => refresh(gid)); persist(); toast(t("resetDone"));
});
$("#lang-fr").addEventListener("click", () => setLang("fr"));
$("#lang-en").addEventListener("click", () => setLang("en"));
$("#bible").addEventListener("toggle", () => { S.bible = $("#bible").open; persist(); });

function setLang(l) {
  if (l === S.lang) return;
  S.lang = l;
  renderStatic();
  renderGrids();
  document.querySelectorAll(".grid .rv").forEach(el => { el.style.animation = "none"; });
  persist();
}

window.addEventListener("resize", () => moveAllPills(true));

/* ===================== quick conversion bar ===================== */
/* extra spellings accepted by the bar, keyed "category.unit" */
const EXTRA = {
  "length.mm": ["millimetre", "millimètre", "millimeter"], "length.m": ["metre", "mètre", "meter", "metres", "mètres"],
  "length.in": ["inch", "inches", "pouce", "pouces", "\""], "length.ft": ["foot", "feet", "pied", "pieds", "'"], "length.mi": ["mile", "miles", "mille", "milles"],
  "force.lbf": ["lbf", "lbs", "livre", "livres"], "force.kip": ["kips", "k"], "force.tonf": ["ton-force", "tonforce"],
  "moment.kNm": ["kNm"], "moment.Nm": ["Nm"], "moment.Nmm": ["Nmm"], "moment.kipft": ["ft·kip", "kft", "kipft", "k·ft"], "moment.kipin": ["in·kip", "kipin", "k·in"], "moment.lbft": ["ft·lb", "lbft"], "moment.lbin": ["in·lb", "lbin"],
  "pressure.Pa": ["N/m²"], "pressure.kPa": ["kN/m²"], "pressure.MPa": ["N/mm²"], "pressure.psi": ["lb/in²", "lb/po²"], "pressure.ksi": ["kip/in²", "kip/po²"], "pressure.psf": ["lb/ft²", "lb/pi²"], "pressure.ksf": ["kip/ft²", "kip/pi²"],
  "lineload.kNm": ["N/mm"], "lineload.plf": ["plf"], "lineload.kipft": ["klf"], "lineload.lbin": ["pli"], "lineload.kipin": ["kli"],
  "mass.lton": ["tonUK", "longton"], "mass.ston": ["tonUS", "shortton"], "mass.t": ["tonne", "tonnes"], "mass.kg": ["kilo", "kilos"],
  "volume.galus": ["gal", "galUS"], "volume.galuk": ["galUK"], "volume.L": ["l", "litre", "litres", "liter"],
  "temp.C": ["C", "degC", "celsius"], "temp.F": ["F", "degF", "fahrenheit"], "temp.K": ["kelvin"],
  "speed.kmh": ["kph", "kmh"], "speed.mph": ["mph"], "accel.g": ["gn"],
  "land.ha": ["hectare", "hectares"], "land.acre": ["acres"], "land.arp": ["arpent", "arpents"],
  "inertia.e6mm4": ["10⁶mm⁴", "e6mm⁴"], "modulus.e3mm3": ["10³mm³", "e3mm³"]
};
const SUPS = { "2": "²", "3": "³", "4": "⁴" };
function canon(str) {
  return String(str).trim()
    .replace(/\s+/g, "")
    .replace(/^10\^?6(?=[A-Za-z])/, "10⁶").replace(/^10\^?3(?=[A-Za-z])/, "10³")
    .replace(/\^/g, "")
    .replace(/([A-Za-z])([234])(?![0-9])/g, (_, a, d) => a + SUPS[d])
    .replace(/([A-Za-z²³⁴])[.*\-·•]([A-Za-z])/g, "$1·$2");
}
const UNIT_INDEX = [];          // {key, lower, cat, gid, unit}
ALL.forEach(cat => cat.groups.forEach(g => g.units.forEach(unit => {
  const names = new Set([unit.s.fr, unit.s.en, ...(EXTRA[`${cat.id}.${unit.id}`] || [])]);
  names.forEach(n => { const key = canon(n); UNIT_INDEX.push({ key, lower: key.toLowerCase(), cat, gid: g.gid, unit }); });
})));
/* exact spelling first, then case-insensitive; main columns before extra ones */
function findUnits(token) {
  const key = canon(token);
  const exact = UNIT_INDEX.filter(x => x.key === key);
  const loose = UNIT_INDEX.filter(x => x.key !== key && x.lower === key.toLowerCase());
  const seen = new Set();
  return [...exact, ...loose].filter(x => { const id = x.gid + "." + x.unit.id; if (seen.has(id)) return false; seen.add(id); return true; });
}

/* "25 ksi en MPa", "3/4 po", "1,5e3 kN·m to kip-ft", "100 °C → °F", "12 in in mm" */
const UNIT_TOK = `[A-Za-zµ°"'][^\\s]*(?:\\s(?:US|UK))?`;
const POW_TOK = `(?:10(?:[⁶³]|\\^?[63])\\s?)?${UNIT_TOK}`;     // CISC "10⁶ mm⁴", "10³ mm³"
const mkCmdRe = tok => new RegExp(`^(.*?)\\s*(${tok})\\s*(?:(?:en|to|in|vers|→|->|=>|=)\\s*(${tok}))?\\s*$`);
const CMD_RES = [mkCmdRe(POW_TOK), mkCmdRe(UNIT_TOK)];
function runCommand(raw) {
  const text = raw.trim();
  if (!text) return null;
  /* try the CISC-prefixed reading first, fall back to the plain one ("2*10³ mm") */
  let m = null, value = null;
  for (const re of CMD_RES) {
    const k = re.exec(text);
    if (!k || !k[1].trim()) continue;
    const v = parse(k[1]);
    if (v == null || Number.isNaN(v)) continue;
    if (findUnits(k[2]).length) { m = k; value = v; break; }
    if (!m) { m = k; value = v; }
  }
  if (!m) return { error: t("cmdNoNum") };
  const [, , srcTok, dstTok] = m;
  const srcs = findUnits(srcTok);
  if (!srcs.length) return { error: t("cmdUnknown")(srcTok) };
  if (!dstTok) return { value, src: srcs[0] };
  const dsts = findUnits(dstTok);
  if (!dsts.length) return { error: t("cmdUnknown")(dstTok) };
  for (const a of srcs) for (const b of dsts) if (a.gid === b.gid) return { value, src: a, dst: b };
  return { error: t("cmdIncompat")(sym(srcs[0].unit), sym(dsts[0].unit)) };
}

let cmdResult = null;
function renderCommand() {
  const out = $("#cmd-out");
  const res = cmdResult = runCommand($("#cmd").value);
  if (!res) { out.innerHTML = ""; return; }
  if (res.error) { out.innerHTML = `<div class="cmd-err">${esc(res.error)} <em>· ${esc(t("cmdHelp"))}</em></div>`; return; }
  const { value, src, dst } = res;
  const base = toBase(src.unit, value);
  const colName = esc(src.cat.name[S.lang]);
  const srcTxt = `${fmt(value, S.lang, "6")} ${sym(src.unit)}`;
  const open = `<button type="button" class="cmd-act" data-cmd="open">${t("cmdOpen")(colName)} →</button><span class="cmd-hint">${t("cmdEnter")}</span>`;
  if (dst) {
    const v = fmt(fromBase(dst.unit, base));
    res.copy = `${v} ${sym(dst.unit)}`;
    out.innerHTML = `<div class="cmd-main"><span class="cmd-eq">${esc(srcTxt)} = <b>${esc(v)}</b> ${esc(sym(dst.unit))}</span>
      <button type="button" class="cmd-act" data-cmd="copy">${t("cmdCopy")}</button>${open}</div>`;
  } else {
    const { g } = GROUPS[src.gid];
    const chips = g.units.filter(x => x.id !== src.unit.id).map(x => {
      const v = fmt(fromBase(x, base));
      return `<button type="button" class="cmd-chip ${g.si.includes(x) ? "si" : "imp"}" data-copy="${esc(v + " " + sym(x))}">${esc(v)}<small>${esc(sym(x))}</small></button>`;
    }).join("");
    out.innerHTML = `<div class="cmd-main"><span class="cmd-eq">${esc(srcTxt)} =</span>${open}</div><div class="cmd-chips">${chips}</div>`;
  }
}
function openCommand() {
  const res = cmdResult;
  if (!res || res.error) return;
  goTo(res.src.cat.id, res.src.unit.id, res.value, res.src.gid, true);
}
function copyText(text) {
  const done = () => toast(`${t("copied")} : <b>${esc(text)}</b>`);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
$("#cmd").addEventListener("input", renderCommand);
$("#cmd").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); openCommand(); }
  else if (e.key === "Escape") { e.target.value = ""; renderCommand(); }
});
$("#cmd-out").addEventListener("click", e => {
  const act = e.target.closest("[data-cmd]");
  if (act) { if (act.dataset.cmd === "copy") copyText(cmdResult.copy); else openCommand(); return; }
  const chip = e.target.closest("[data-copy]");
  if (chip) copyText(chip.dataset.copy);
});
document.addEventListener("keydown", e => {
  const typing = e.target.closest && e.target.closest("input, textarea");
  if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault(); $("#cmd").focus(); $("#cmd").select();
  }
});

/* ===================== boot ===================== */
renderStatic();
renderGrids();

function arrive() {
  requestAnimationFrame(() => moveAllPills(true));
  setTimeout(() => moveAllPills(true), 900);
}

arrive();
})();
</script>

<style>
.qu-upd{position:fixed;left:50%;bottom:72px;transform:translate(-50%,14px);opacity:0;display:flex;align-items:center;gap:12px;background:#007f78;color:#fff;padding:9px 10px 9px 18px;border-radius:999px;font:500 .88rem 'Segoe UI',system-ui,sans-serif;box-shadow:0 10px 30px #0b1e2b55;z-index:60;transition:opacity .3s,transform .35s cubic-bezier(.2,.85,.2,1);max-width:calc(100vw - 32px)}
.qu-upd.show{opacity:1;transform:translate(-50%,0)}
.qu-upd a{background:#d9f5eb;color:#102d41;font-weight:650;text-decoration:none;padding:5px 14px;border-radius:999px;white-space:nowrap}
.qu-upd button{background:none;border:0;color:#d9f5eb;font-size:1.1rem;cursor:pointer;padding:0 4px;line-height:1}
@media print{.qu-upd{display:none!important}}
</style>
<script>
(() => {
  const MINE = "0.4";
  if (!/^https?:$/.test(location.protocol)) return;          // offline file: nothing to check
  if (/[?&]v=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
  const newer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };
  let shown = false, last = 0;
  async function check() {
    if (shown || Date.now() - last < 60000) return;
    last = Date.now();
    try {
      const html = await (await fetch("./?t=" + last, { cache: "no-store" })).text();
      const m = html.match(/QU_META\s*=\s*\{\s*version:\s*"([\d.]+)"/);
      if (m && newer(m[1], MINE)) show(m[1]);
    } catch { /* offline */ }
  }
  function show(v) {
    shown = true;
    const fr = (document.documentElement.lang || "fr").startsWith("fr");
    const el = document.createElement("div");
    el.className = "qu-upd"; el.setAttribute("role", "status");
    el.innerHTML = `<span>${fr ? "Nouvelle version" : "New version"} <b>v${v}</b> ${fr ? "disponible" : "available"}</span>`
      + `<a href="./?v=${v}">${fr ? "Mettre à jour" : "Update"}</a><button type="button" aria-label="${fr ? "Fermer" : "Close"}">×</button>`;
    el.querySelector("button").onclick = () => el.remove();
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
  }
  check();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  addEventListener("focus", check);
  setInterval(check, 15 * 60000);
})();
</script>
